# ==============================================================================
# SonarQube SAST Configuration
# SecureID — Secure Digital Identity Management System
# ==============================================================================

# Project Identification
sonar.projectKey=secureid-identity-system
sonar.projectName=SecureID — Secure Digital Identity Management System
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests

# Inclusions & Exclusions
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/data/**,**/*.test.ts,**/*.spec.ts,**/scripts/**

# Test Inclusions
sonar.test.inclusions=backend/tests/**/*.test.ts,backend/tests/**/*.spec.ts

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Source Code Encoding
sonar.sourceEncoding=UTF-8

# Security & Quality Standards
sonar.issue.ignore.multicriteria=
sonar.qualitygate.wait=true
